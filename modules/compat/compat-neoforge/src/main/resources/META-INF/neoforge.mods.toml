modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = """${description}"""
[[dependencies.${mod_id}]]
    modId = "neoforge"
    type="required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "minecraft"
    type="required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"


